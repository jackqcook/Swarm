# configs/sim_default.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Stage 1 — SITL simulation (no real hardware required, but PX4 SITL must be
# running). Recommended Mac path:
#     Terminal 1:  ./scripts/launch_sitl.sh        # PX4 SITL (SIH backend)
#     Terminal 2:  hawkeye                          # 3D visualizer
#     Terminal 3:  python -m drone.agent --sim --config configs/sim_default.yaml
# Default MAVSDK SITL address: udp://:14540
#
# For typed-command testing without PX4 installed, use configs/mock_default.yaml
# instead (sets mavlink.mock: true and skips the MAVSDK connection).
# ─────────────────────────────────────────────────────────────────────────────

mavlink:
  sitl_address: "udp://:14540"
  serial_port: "/dev/ttyUSB0"      # Used when --sim is NOT passed
  baud_rate: 57600
  heartbeat_timeout_s: 10

interpreter:
  # Model options (ordered by speed on Jetson Orin Nano 8GB FP4):
  #   "mock"                                → instant, no GPU, for unit tests
  #   "vikhyatk/moondream2"                 → fastest real model (~540ms on AGX Orin)
  #   "HuggingFaceTB/SmolVLM-2B-Instruct"  → balanced
  #   "google/paligemma2-3b-pt-224"         → best quality on Orin Nano
  #   "Qwen/Qwen2.5-VL-3B-Instruct"        → best quality overall (needs more RAM)
  model_id: "mock"
  device: "cpu"        # "cpu" | "cuda" | "cuda:0" | "mps" (Apple Silicon)
  quantize: false      # Set true for INT4 on Jetson (requires bitsandbytes)

  # KnowNo ambiguity gating
  # NOTE: τ=0.50 is tuned for the *mock* VLM used by this config. The mock
  # assigns generic fly_to commands p=0.55, so τ=0.60 (the original default)
  # would clarify every fly_to command. With τ=0.50 they execute. When you
  # swap in a real VLM (see model_id above), bump τ back up to 0.60 and
  # calibrate against your own labeled dataset.
  knowno_tau: 0.50
  knowno_coverage: 0.85

perception:
  camera_backend: "mock"   # "mock" | "webcam" | "realsense"
  webcam_id: 0
  device: "cpu"
  fps: 15
  yolo_size: "n"           # "n" (nano) | "s" (small) | "m" (medium)
  mock_detections: true    # Force mock detections even with real camera

planner:
  safety_radius_m: 5.0     # Repulsion activates within this distance
  max_speed_m_s: 3.0
  attraction_gain: 0.5
  repulsion_gain: 2.0
